# =============================================================================
# Reconstructed from scan0006.pdf (28-page scan of a printed YAML schema,
# 4 logical pages per sheet, ~110 pages / ~5,000 lines).
#
# Rebuilt by OCR + structural reconstruction on 2026-08-13.
# Keys, types, initialValue/min/max and option enums are high confidence.
# Free-text `documentation:` blocks may still contain OCR artifacts and the
# original line breaks inside them could not be recovered (long lines were
# re-wrapped by the printer). Verify against the original source if available.
# =============================================================================
# ============ Groups ============
IO Format of Data:
  type: group-tag
  documentation: |
    Arguments related to data loading and understanding from disk.
Column Type Inference:
  type: group-tag
  documentation: |
    Parameters helping the decision of the data type of each column. ht contains parameters either directly specifying
    the data types, or the policies on how to distinguish different data types if the data type is not directly
    specified.
N/A Handling:
  type: group-tag
  documentation: |
    Paramatets specifying policies to remove N/A values.
Default Arguments by Data Type:
  type: group-tag
  documentation: |
    Default parameter settings for each data type specifically.
Column Data Specification:
  type: group-tag
  documentation: |
    Parameters helping the model to understand WHAT the data is. itcontains parameters on the format and basic
    properties of the column.
Data Encoding Arguments:
  type: group-tag
  documentation: |
    Parameters determining HOW to represent the data in a tensor which Is subsequently fed into the neural networks.
Training Arguments:
  type: group-tag
  documentation: |
    General training arguments for typical machine learning tasks,
Generation Arguments:
  type: group-tag
  documentation: |
    Generation arguments for the synthetic data.
Specification of Each Column:
  type: group-tag
  documentation: |
    Parameter settings for each column separately,
Relational Schema:
  type: group-tag
  documentation: |
    Parameters that specify the relationship between different tables.
Aggregation Specification:
  type: group-tag
  documentation: |
    Arguments specifying how to aggregate, and hence summary the content of a child table so the information can be
    aligned with the parent table.
Relational Modeling Parameters:
  type: group-tag
  documentation: |
    Arguments for relational modeling. BEAT AE AEE AEE AAT HE EE Disk LO APSE AEE AE ATE EERE TEP PEEE A SETAE A EE AEE
