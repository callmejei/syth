    - Medium Impact
  documentation: |
    The text to strip at two ends of categorical data. For example, when space is provided, Category "A" and " A" or
    A" are treated as the same category. Note that the stripping will not be recovered in the generated data.
  groupTag: Column Data Specification
fillna_value:
  type: skipped # text
  label: fillna value
  documentation: |
    The value to replace all N/A values with.
    If not provided, we will use an Is-N/A indicator (like the effect of applying '.isnal)" on the column) as auxiliary
    binary feature, and use ` fillna_policye to fill the N/A values.
    You can also provide a policy name as defined In * fillna_policy" to directly fill N/A values by the policy, but
    using the policies at this parameter will not guarantee the information on whother the data is N/A is maintained
    fully.
    ## Example
    - 0 or -9999, as typical values to fill N/As in numerical, or
    - "min"/"mean`, etc., to apply policies and fill the N/A values, or
    - leave it empty, to keep the information of whether the data is N/A as an additional feature.
    ## Caveat
    1. If some value in the column is the same as the value to fill N/A, then N/A will be indistinguishable to these
    values, and hence Information loss might be possible. During sampling of synthetic date, all values equal to this
    fillna_value` will be treated as N/A in the output. This may result in more N/A valuos than expected.
    2. Values same as the policy names are reserved for the policies, so you cannot choose these strings as the value to
    fill N/A values with,
  initialValue:
  tags:
    - Medium Impact
  groupTag: N/A Handling
fillna_policy:
  type: skipped # select
  label: fillna policy
  documentation: |
    The policy to fill N/A values, after is-N/A indicator is extracted. This argument will take no affect if
    - fillna_value" is provided.
    The poticies are:
    - "*mean**; Mean value in the column, applicable for continuous columns only. Boware of potential breaking of
    rounding by mean (for example, in a column [1, 1, 2, 2, N/A], the mean is 1.5, but the column is actually integer,
    and this may result in the later teaming see the column after removing N/A values as [1, 1, 2, 2, 1.5], and hence
    learn it 4s a float column rather than integer column).
    - **min**: Minimum velue in the column, applicable for continuous columns only.
    - **special"*: Special value out of the range, like anew category in categorical value, or a very small value in
    continuous columns. The value will be automatically determined.
    - "*sample**: Sampled values in the column, which will assign differant values to different N/A values.
  initialValue: min
  options:
    - value: mean
