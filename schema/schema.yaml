# ============ SPN Model Parameters ============
spn_config:
  type: object
  label: SPN_Config
  fields:
    - beta
    - private
    - epsilon
beta:
  type: number
  label: beta
  documentation: |
    Minimum leaf size to build SUM node, node with less data will all be PRODUCT node.
  initialValue: 100000
private:
  type: boolean
  label: private
  documentation: |
    Enable differential privacy mode for the SPN model.
  initialValue: felse
  conditional: true
epsilon:
  type: number
  label: epsilon
  documentation: |
    The epsilon parameter for differential privacy mode.
  initialValue: 2.0
  conditions:
    - field: './private'
      is: true
