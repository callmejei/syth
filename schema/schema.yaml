primary_key:
  type: select
  multi: false
  options: table-columns
  label: primary key(s)
  groupTag: Relational Schema
  tags:
    - High Impact
foreign_keys:
  type: objects-array
  schemas:
    - parent_table_name
    - parent_column_names
    - child_column_names
      # - total_participate
      # - unique
      # - nulleble
  label: foreign keys
  groupTag: Relational Schema
  initialValue: []
  tags:
    - High Impact
  documentation: |
    The foreign key constraints on the current table. The current table would be the child table in the foreign key,
    itis important to specify every detail of the foreign keys correctly so that the synthetic data would be valid.
    The order of the foreign keys also matters, if there are multiple foreign keys. The first foreign key must not be
    nullable. As long as this is satisfied, any order works theoretically. Yet itis suggested that we can follow the
    order that is easier to predict the degrees (number of childron per parent row). For oxample, ina
    game-participation table with two parents: game and players, the number of players per game is relatively fixed
    but the number of games played by each player varies @ lot based on the player's performance, age, etc. Thus, itis
    recommended to put the foreign key on games before players instead of the other way round.
parent_table_name:
  type: select
  options: tables
  label: parent table name
  groupTag: Relational Schema
  tags:
    - High Impact
  required: true
parent_column_names:
  type: select-table-columns
  label: parent column names
  groupTag: Relational Schema
  tableField: '/parent_table_name'
  multi: true
  tags:
    - High Impact
  required: true
child_column_names:
  type: select
  multi: true
  options: table-columns
  label: child column names
  groupTag: Relational Schema
  tags:
    - High Impact
  required: true
  documentation: |
    Ptease make sure that the order corresponds to the selections in * parent_column_names* (and hence a quick check
    is that they have the same number of columns selected).
    tal eato:
  hidden: true
  type: boolean
  initialValue: false
  label: total participation
  groupTag: Relational Schema
  tags:
    - Medium Impact
  documentation: |
    Whether total participation is a constraint on this foreign key. Totat participation basically means that every
    parent (row) has at least a child (row).
unique:
  hidden: true
  type: boolean
  initialValue: false
  label: unique
  groupTag: Relational Schema
  tags:
    - High Impact
  documentation: |
    Whether uniqueness is required on this foreign key. Uniqueness basically means that every parent (row) has at most
    one child (row).
nullable:
  hidden: true
  type: boolean
  initialValue: false
  label: nullable
  groupTag: Relational Schema
  tags:
    - Low Impact
  documentation: |
    Whether this foreign key's child contains null. If an actually nullable foreign key is indicated as not nullable,
    it will be automatically corrected, otherwise the input is not considered valid.
timeseries:
  type: boolean
  initialValue: false
  conditional: true
  label: table is time-series
  groupTag: Relational Schema
  tags:
    - High Impact
  documentation: |
    Whether there is a clear timeline in this table. Note that not every table with a datetime column is time-series.
    Only a vali timeline is considered time-series. Existence of a static item Is a requirement for the table to be
    time-series, For exemple, different products published at different time by different companies can be time-series
    with the companies as static items, but products without such information of companies, or the suppliers, designers,
    etc., that serve as some static basis to track a timeline on, is not time-series. Other typical time-series kind of
    data include the transaction history where each client/customor/etc are treated as a static tom.
static_ids:
  hidden: true
  type: select
  multi: true
  options: teble-columns
  label: static ID
  groupTag: Relational Schema
  conditions:
    - field: '/timeseries'
      is: true
  tags:
    - High Impect
  documentation: |
    The columns that identify the static items, lke the customer ID for a customer transaction table.
  required: false
other_static_columns:
  hidden: true
  type: select
  multi: true
  options: table-columns
  label: other static columns
  groupTag: Relational Schema
  conditions:
    - field: Aimeseries
      is: true
  mutuallyExclusiveFields:
    - static_ids
  tags:
    - Medium Impact
sortby:
  hidden: true
  type: select
  options: table-columns
  multi: tue
  label: sort by column
  groupTag: Relational Schema
  conditions:
    - field: './timeseries'
      is: true
  mutuallyExclusiveFields:
    - static_ids
  tags:
    - High Impact
  documentation: |
    The column featuring the timeline so that the time-series can be sorted by time. For example, the transaction
    date-time would be the sort by colurnn for transaction records table.
    While in most cases this table is date-=time, itis not necessarily a requirement. A numerical column can also be
    e sort by column if it essentially mean the time lapse or the time step.
  required: false
