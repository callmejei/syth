main_method:
  type: skipped # select. Skipped it for now because | was facing errors It with combination with auxilary_method and modify_be_additional_components
  initialValue: numerical
  required: true
  documentation: |
    The main method used to standardize the datetime data.
    This method is used as the basis of inverse the standardization step when there is conflict.
    Methods include:
    - **as numoricai*: Converting the entire date-time value as a numerical value based on the units and chunks
    calculated in difference to the minimum value in the column.
    For example, for column [2020-01-01 s2020-01-03,2020-01-05] with * smallest datetime unite being day and
    smallest chunk` being 2, the values standardized ere [0,1,2}.
    - **date-time**: Separating the date and time component, each as a datetime raw data standardized by
    - *as numerical"* above.
    - "*unit components"*; Separating year, month, day, hour, minute, second, and microsecond components, each as a
    rounded and ranged numerical column.
    - "weekly factorizotion**: Separating year, week of year, day of week, hour, minute, second, and microsecond
    components, each as a rounded and ranged numerical column.
    - **yearly factorization`*: Separating year, day of year, hour, minute, second, and microsecond components,
    each as a rounded and ranged numerical column,
    - **unit components and time**: Separating year, month, day, time components, where time is representod as a
    datetime raw deta standardized by ` as numerical` and year, month, and day are rounded and ranged numerical
    columns.
    - "weekly factorization and time**: Separating year, week of year, day of week, time components, where time is
